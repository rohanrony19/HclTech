server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        # Route for business API
        - id: customer-service
          uri: lb://MicroservicesClient
          predicates:
            - Path=/customers/**

        # Route for Swagger of MicroservicesClient
        - id: customer-swagger
          uri: lb://MicroservicesClient
          predicates:
            - Path=/v3/api-docs/customers
          filters:
            - RewritePath=/v3/api-docs/customers, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# --- Add Swagger UI aggregation here ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: customers
        url: /v3/api-docs/customers
  api-docs:
    enabled: true