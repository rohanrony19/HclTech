spring.application.name=resumeupload
# File size limits (tune as needed)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Base folder for storing files (relative or absolute)
app.upload.base-dir=uploads

# Subfolders for logical separation
app.upload.photos-dir=photos
app.upload.resumes-dir=resumes

# Public base URL for files (if you expose them statically)
# If you\u2019re serving from /files/** \u2192 map it in WebMvc config below
app.files.public-base-url=http://localhost:8080/files

spring.datasource.url=jdbc:postgresql://localhost:5432/springboot
spring.datasource.username=postgres
spring.datasource.password=root@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

